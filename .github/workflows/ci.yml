name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: V1 Bash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Ubuntu setup
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y shellcheck

      # macOS setup
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install shellcheck bash
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH

      # Windows setup (Git Bash)
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install shellcheck -y

      # Runtime selection
      - name: Verify Bash 4+ runtime
        shell: bash
        run: |
          resolved_bash="$(command -v bash)"
          printf 'Resolved Bash: %s\n' "$resolved_bash"
          "$resolved_bash" --version
          printf 'Executing Bash: %s\n' "$BASH"
          printf 'Executing Bash major version: %s\n' "${BASH_VERSINFO[0]}"
          if ((BASH_VERSINFO[0] < 4)); then
            printf 'The executing shell must be Bash 4 or newer.\n' >&2
            exit 1
          fi
          if ! "$resolved_bash" -c '((BASH_VERSINFO[0] >= 4))'; then
            printf 'The Bash resolved through PATH must be version 4 or newer.\n' >&2
            exit 1
          fi

      # Lint
      - name: Lint with ShellCheck
        shell: bash
        run: |
          # run.sh carries source annotations for every case and helper.
          shellcheck -x \
            dstack.sh \
            tests/characterization/run.sh \
            tests/characterization/helpers/child-driver.bash \
            tests/characterization/stubs/docker \
            tests/characterization/stubs/docker-deny

      # Syntax check
      - name: Syntax check
        shell: bash
        run: |
          bash_files=(
            dstack.sh
            tests/characterization/run.sh
            tests/characterization/cases/*.bash
            tests/characterization/helpers/*.bash
            tests/characterization/stubs/docker
            tests/characterization/stubs/docker-deny
          )
          for bash_file in "${bash_files[@]}"; do
            printf 'Checking Bash syntax: %s\n' "$bash_file"
            bash -n "$bash_file"
          done

      # Executable check (skip Windows)
      - name: Ensure executable scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -x dstack.sh
          test -x tests/characterization/run.sh
          test -x tests/characterization/stubs/docker
          test -x tests/characterization/stubs/docker-deny

      # Sourced runtime check
      - name: Verify sourced version command
        shell: bash
        run: |
          source ./dstack.sh
          expected="DStack $DSTACK_VERSION"
          actual="$(dversion)"
          printf 'Expected version output: %s\n' "$expected"
          printf 'Actual version output:   %s\n' "$actual"
          [[ "$actual" == "$expected" ]]

      # Non-interactive characterization
      - name: Run characterization suite
        shell: bash
        run: bash tests/characterization/run.sh all

  interactive-characterization:
    name: V1 PTY (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify PTY runtime
        shell: bash
        run: |
          command -v bash
          bash --version
          ((BASH_VERSINFO[0] >= 4))
          command -v python3
          python3 --version
          python3 -c 'import pty'

      - name: Run interactive characterization suite
        shell: bash
        run: bash tests/characterization/run.sh interactive

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --all-features --locked

  rust-native:
    name: Rust native (${{ matrix.os }})
    needs:
      - lint-and-test
      - interactive-characterization
      - rust-quality
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        run: cargo test --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify native version (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          actual="$(target/release/dstack --version)"
          printf 'Native version output: %s\n' "$actual"
          test "$actual" = "dstack 2.0.0"

      - name: Verify native version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = & .\target\release\dstack.exe --version
          Write-Host "Native version output: $actual"
          if ($actual -ne "dstack 2.0.0") {
            throw "Unexpected DStack version output: $actual"
          }

      - name: Verify native redirected output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DSTACK_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "dstack-output-smoke"
          $lines = @(& .\target\release\dstack.exe registry list)
          if ($LASTEXITCODE -ne 0) {
            throw "Native registry list failed with exit code $LASTEXITCODE"
          }
          if ($lines[0] -ne "NAME  PATH  FILES") {
            throw "Unexpected native registry header: $($lines[0])"
          }
          $output = $lines -join "`n"
          if ($output.Contains("`t")) {
            throw "Native redirected output contains a tab separator"
          }
          $escapePrefix = [string][char]27 + "["
          if ($output.Contains($escapePrefix)) {
            throw "Native redirected output contains an ANSI escape sequence"
          }
