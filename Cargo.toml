[package]
name = "dstack-compose"
version = "2.0.0"
edition = "2024"
description = "Docker Compose stack management from anywhere"
license = "MIT"
readme = "README.md"
repository = "https://github.com/kyanjeuring/dstack"
keywords = ["docker", "compose", "cli", "containers"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "src/**",
  "tests/phase1_cli.rs",
  "tests/phase2_registry_cli.rs",
  "tests/phase3_resolution_cli.rs",
  "tests/phase7_session_cli.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
]

[[bin]]
name = "dstack"
path = "src/main.rs"

[dependencies]
anstream = "1.0"
anstyle = "1.0"
atomic-write-file = "0.3.1"
clap = { version = "4.6", features = ["derive", "string"] }
clap_complete = "4.6"
dirs = "7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
unicode-width = { version = "0.2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27"
